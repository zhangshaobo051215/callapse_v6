_base_: vit_tiny_tinyimagenet.yaml
experiment:
  name: vit_tiny_tinyimagenet_elr_collapse_smoke
  output_dir: outputs/smoke
  seed: 20260726
  data_seed: 1729
  deterministic: true
  device: cuda
  resume: true
data:
  root: data/tiny-imagenet-200
  download: false
  num_workers: 4
  pin_memory: true
  global_batch_size: 128
  micro_batch_size: 128
  auto_microbatch: true
  probe_size: 256
  drop_last: true
  max_train_samples: 5000
optimizer:
  name: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0
  peak_lr: 6.0e-4
  final_lr: 6.0e-5
  total_steps: 300
  warmup_steps: 20
  control_start_step: 100
  decay_start_step: 270
  grad_clip_norm: null
control:
  policy: hidden_matrices
  projection_eps: 1.0e-12
  schedules: [constant, linear_up, linear_down, cyclic]
  cyclic_period_steps: 80
  cyclic_amplitude: 0.5
  linear_up_final: 2.0
  linear_down_final: 0.3333333333333333
  modify_optimizer_moments: false
logging:
  train_log_interval: 1
  probe_interval: 100
  val_interval: 1000
  angular_interval: 20
  checkpoint_interval: 100
  ema_beta: 0.99
radial_audit:
  scales: [0.5, 2.0]
  groups: [attn_qkv, attn_proj, mlp_fc1, mlp_fc2, all_hidden, patch_embed,
           classifier_head, pos_embed, cls_token, layernorm_gains]
